# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Replaces ai-service-ci.yml, backend-ci.yml, frontend-ci.yml and the old ci.yml.
# docker-build.yml (image build/push) stays separate. CI never deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: frontend
      node-version: "22"
      require-tests: true
      build-command: NEXT_PUBLIC_BACKEND_URL=http://localhost:8080 npm run build

  ai-service:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: ai-service
      python-version: "3.11" # Dockerfile: python:3.11-slim
      # Rules are pinned in ai-service/ruff.toml; `ruff format --check` is not enforced yet (docs/UPGRADE-PLAN.md).
      format-check: false
      # Unit tests need no database or network; pytest.ini deselects `integration`. The second command
      # fails when requirements.txt (installed by the Dockerfile) no longer matches uv.lock.
      test-command: >-
        python -m pytest -q
        && uv export --frozen --no-dev --no-emit-project --format requirements-txt -q | diff -u requirements.txt -

  # The shared workflows have no Go job yet, so the backend keeps its own lint, test and build.
  backend-lint:
    name: backend (golangci-lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # Pinned: `latest` silently picks up new linters. v2.15 supports go.mod `go 1.26`.
          version: v2.15.0
          working-directory: backend

  backend-test:
    name: backend (migrations + tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bookreading
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: bookreading_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Builds the schema from migrations alone (up, down, up); the repository tests then run against it.
      - name: Check migration chain
        run: scripts/check-migrations.sh "postgres://bookreading:testpassword@localhost:5432/bookreading_test?sslmode=disable"
      - name: Test
        working-directory: backend
        run: go test -race ./...
        env:
          DATABASE_URL: postgres://bookreading:testpassword@localhost:5432/bookreading_test?sslmode=disable
          BOOKREADING_TEST_DATABASE_URL: postgres://bookreading:testpassword@localhost:5432/bookreading_test?sslmode=disable
      - name: Build
        working-directory: backend
        run: go build -ldflags="-w -s" ./cmd/main.go

  compose-build:
    name: docker compose build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml requires .env with non-empty POSTGRES_PASSWORD / JWT_SECRET;
      # the committed example has placeholders good enough to build.
      - name: Prepare placeholder env
        run: cp .env.example .env
      - name: Build images
        run: docker compose build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
